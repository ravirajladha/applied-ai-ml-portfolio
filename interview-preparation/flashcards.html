<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI/ML Interview Flashcards — 100 questions</title>
<style>
:root{
  --bg:#f1f5f9; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#94a3b8;
  --edge:#e2e8f0; --accent:#3b82f6; --accent2:#8b5cf6; --good:#10b981; --warn:#f59e0b;
  --shadow:0 10px 30px rgba(15,23,42,.10), 0 2px 6px rgba(15,23,42,.06);
  --radius:18px;
}
html[data-theme="dark"]{
  --bg:#0b1120; --panel:#151d2e; --ink:#e8eefc; --muted:#94a3b8; --line:#64748b;
  --edge:#26324a; --shadow:0 10px 30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; padding:0 0 60px;
}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{padding:26px 0 14px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 10px}
select,button{
  font:inherit;font-size:13px;color:var(--ink);background:var(--panel);
  border:1px solid var(--edge);border-radius:10px;padding:7px 11px;cursor:pointer;
  transition:.15s border-color,.15s background,.15s transform;
}
select:hover,button:hover{border-color:var(--line)}
button:active{transform:translateY(1px)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.spacer{flex:1}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- progress ---------- */
.bar{height:5px;background:var(--edge);border-radius:99px;overflow:hidden;margin:6px 0 18px}
.bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:99px;transition:width .3s ease}

/* ---------- card ---------- */
.stage{perspective:1600px}
.card{position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.15,.2,1);
  min-height:470px}
.card.flip{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:26px;display:flex;flex-direction:column;overflow:hidden;
}
.face.back{transform:rotateY(180deg)}
.meta{display:flex;align-items:center;gap:9px;margin-bottom:auto}
.pill{font-size:11px;font-weight:600;letter-spacing:.3px;padding:4px 9px;border-radius:99px;
  background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.num{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.star{color:var(--warn);font-size:12px;letter-spacing:-1px}
.q{font-size:23px;line-height:1.34;font-weight:600;letter-spacing:-.35px;margin:20px 0}
.hint{margin-top:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kbd{border:1px solid var(--edge);border-bottom-width:2px;border-radius:5px;padding:1px 5px;
  font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}

/* back face */
.back{overflow-y:auto}
.qsm{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:12px;line-height:1.4}
.ans{font-size:16.5px;line-height:1.5;font-weight:500;margin:0 0 14px}
.keys{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:6px}
.keys li{font-size:13.5px;line-height:1.45;color:var(--ink);padding-left:18px;position:relative}
.keys li::before{content:"";position:absolute;left:3px;top:7px;width:6px;height:6px;border-radius:2px;
  background:var(--accent2)}
.dia{margin-top:auto;background:color-mix(in srgb,var(--ink) 3.5%,transparent);
  border:1px solid var(--edge);border-radius:12px;padding:8px 10px}
.dia svg{display:block;width:100%;height:auto;max-height:190px}
.cap{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}

/* ---------- nav ---------- */
.nav{display:flex;gap:8px;align-items:center;margin-top:18px}
.nav button{padding:10px 16px;font-weight:500}
.nav .big{flex:1;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.nav .big:hover{filter:brightness(1.07)}
.known{border-color:var(--good);color:var(--good)}
.known.on{background:var(--good);border-color:var(--good);color:#fff}

/* ---------- grid ---------- */
.grid{display:none;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:20px}
.grid.show{display:grid}
.grid b{display:flex;align-items:center;justify-content:center;height:38px;border-radius:9px;
  border:1px solid var(--edge);background:var(--panel);font-size:12px;font-weight:600;
  color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums;transition:.12s}
.grid b:hover{border-color:var(--accent);color:var(--accent)}
.grid b.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.grid b.kn{background:color-mix(in srgb,var(--good) 16%,transparent);border-color:var(--good);color:var(--good)}
.defs{position:absolute;width:0;height:0;overflow:hidden}
@media(max-width:560px){ .q{font-size:19px} .face{padding:20px} .card{min-height:520px} }
</style>
</head>
<body>

<svg class="defs" xmlns="http://www.w3.org/2000/svg"><defs>
  <marker id="ah"  markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#94a3b8"/></marker>
  <marker id="ahb" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#3b82f6"/></marker>
  <marker id="ahg" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#10b981"/></marker>
  <marker id="ahr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#ef4444"/></marker>
  <marker id="ahv" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#8b5cf6"/></marker>
</defs></svg>

<div class="wrap">
  <header>
    <h1>AI/ML Interview Flashcards</h1>
    <p class="sub">100 questions · flip for a short answer and a diagram · ★ marks high-frequency</p>
    <div class="tools">
      <select id="sec"></select>
      <button id="shuffle">Shuffle</button>
      <button id="hide">Hide known</button>
      <button id="grid">All cards</button>
      <span class="spacer"></span>
      <span class="count" id="count"></span>
      <button id="theme" title="Toggle theme">◐</button>
    </div>
    <div class="bar"><i id="fill"></i></div>
  </header>

  <div class="stage"><div class="card" id="card">
    <div class="face front">
      <div class="meta"><span class="pill" id="fsec"></span><span class="num" id="fnum"></span><span class="star" id="fstar"></span></div>
      <div class="q" id="fq"></div>
      <div class="hint"><span class="kbd">space</span> flip &nbsp;·&nbsp; <span class="kbd">←</span><span class="kbd">→</span> move &nbsp;·&nbsp; <span class="kbd">k</span> known</div>
    </div>
    <div class="face back">
      <div class="qsm" id="bq"></div>
      <div class="ans" id="ba"></div>
      <ul class="keys" id="bk"></ul>
      <div class="dia"><div id="bd"></div><div class="cap" id="bc"></div></div>
    </div>
  </div></div>

  <div class="nav">
    <button id="prev">← Prev</button>
    <button class="big" id="flip">Flip card</button>
    <button id="next">Next →</button>
    <button class="known" id="mark">✓ Known</button>
  </div>

  <div class="grid" id="gridbox"></div>
</div>

<script>
/* ============================ drawing helpers ============================ */
const B='#3b82f6',G='#10b981',R='#ef4444',Y='#f59e0b',V='#8b5cf6',C='#06b6d4',N='#94a3b8';
const S=(inner,vb='0 0 300 150')=>`<svg viewBox="${vb}">${inner}</svg>`;
const t=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.s||9.5}" fill="${o.f||'currentColor'}" text-anchor="${o.a||'middle'}" font-weight="${o.w||500}" opacity="${o.o??1}">${s}</text>`;
const tm=(x,y,s,o={})=>t(x,y,s,Object.assign({f:N,s:9},o));
const rc=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r??5}" fill="${o.f||'none'}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.6}" opacity="${o.o??1}" stroke-dasharray="${o.dash||'none'}"/>`;
const ln=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s||N}" stroke-width="${o.sw||1.6}" stroke-dasharray="${o.dash||'none'}" stroke-linecap="round" opacity="${o.o??1}"/>`;
const ci=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||'none'}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.6}" opacity="${o.o??1}"/>`;
const pa=(d,o={})=>`<path d="${d}" fill="${o.f||'none'}" stroke="${o.s||'none'}" stroke-width="${o.sw||2}" stroke-linecap="round" stroke-linejoin="round" opacity="${o.o??1}"/>`;
const M={[N]:'ah',[B]:'ahb',[G]:'ahg',[R]:'ahr',[V]:'ahv'};
const ar=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s||N}" stroke-width="${o.sw||1.6}" marker-end="url(#${M[o.s||N]||'ah'})" stroke-dasharray="${o.dash||'none'}"/>`;
const bx=(x,y,w,h,lb,c=B,o={})=>rc(x,y,w,h,{f:c,o:o.fo??.15,s:c,r:o.r??6})+t(x+w/2,y+h/2+3.4,lb,{s:o.s||9.5,w:600});
const ax=(x,y,w,h)=>ln(x,y,x,y+h,{s:N,o:.7})+ln(x,y+h,x+w,y+h,{s:N,o:.7});
const dots=(a,c,r=3.1)=>a.map(([x,y])=>ci(x,y,r,{f:c})).join('');
const bell=(cx,by,w,h)=>{let d=`M${cx-w} ${by}`;for(let i=-w;i<=w;i+=2)d+=` L${cx+i} ${by-h*Math.exp(-(i*i)/(2*(w/2.6)**2))}`;return d;};
const curve=(pts)=>'M'+pts.map(p=>p.join(' ')).join(' L');

/* ============================ the 100 cards ============================ */
const CARDS=[
/* ---- 1. Fundamentals ---- */
{n:1,s:'Fundamentals',x:1,q:'What is Artificial Intelligence?',
 a:'The field of building systems that do tasks normally needing human intelligence. AI is the umbrella; ML is one way of achieving it.',
 k:['AI = the goal, ML = a method, DL = a method within ML','Includes rule-based systems, not just learning'],
 c:'AI ⊃ ML ⊃ Deep Learning',
 d:ci(150,88,62,{f:B,o:.12,s:B})+ci(150,96,42,{f:G,o:.15,s:G})+ci(150,104,23,{f:V,o:.2,s:V})
   +t(150,40,'AI',{s:13,w:700,f:B})+t(150,68,'ML',{s:12,w:700,f:G})+t(150,108,'DL',{s:11,w:700,f:V})},

{n:2,s:'Fundamentals',x:1,q:'What is Machine Learning?',
 a:'A system that learns patterns from data instead of being programmed with explicit rules.',
 k:['Mitchell: improves at task T, measured by P, with experience E','Show it 10,000 labelled emails — it derives the spam rule itself'],
 c:'Data in, learned rule out',
 d:bx(14,58,64,42,'Data',B)+ar(82,79,104,79,{s:N})+bx(108,52,76,54,'Model',V)
   +ar(188,79,210,79,{s:N})+bx(214,58,72,42,'Predict',G)
   +tm(150,126,'learns the rule, not told the rule')},

{n:3,s:'Fundamentals',x:1,q:'Difference between AI, ML and Deep Learning?',
 a:'Nested sets. AI is any technique that looks smart, ML learns the mapping from data, DL uses multi-layer neural networks that also learn the features.',
 k:['ML usually needs hand-engineered features','DL learns features itself — needs more data and GPUs'],
 c:'Same idea, three levels of specificity',
 d:bx(8,30,88,34,'AI',B)+tm(52,80,'rules + search')+tm(52,94,'+ learning')
   +bx(106,30,88,34,'ML',G)+tm(150,80,'learns mapping')+tm(150,94,'you make features')
   +bx(204,30,88,34,'DL',V)+tm(248,80,'neural nets')+tm(248,94,'learns features too')
   +ar(96,47,104,47,{s:N})+ar(194,47,202,47,{s:N})+tm(150,128,'each is a subset of the one before')},

{n:4,s:'Fundamentals',q:'What is Data Science and how is it different from ML?',
 a:'Data Science is the whole practice of getting insight from data — collection, cleaning, analysis, visualisation, statistics. ML is one tool inside it.',
 k:['Data scientist: framing + EDA + communication','ML engineer: building, training and shipping models'],
 c:'ML is a subset of the wider practice',
 d:ci(120,78,52,{f:B,o:.13,s:B})+ci(190,78,40,{f:V,o:.16,s:V})
   +t(96,80,'Data Science',{s:10,w:700,f:B})+t(206,82,'ML',{s:11,w:700,f:V})
   +tm(150,138,'stats · EDA · viz · engineering · modelling')},

{n:5,s:'Fundamentals',x:1,q:'What are the types of Machine Learning?',
 a:'Supervised (labelled data), unsupervised (no labels), semi-supervised (a mix), and reinforcement (learn from rewards).',
 k:['Supervised → classification & regression','Unsupervised → clustering & dimensionality reduction','RL → agent, actions, rewards'],
 c:'Four families, split by what feedback you get',
 d:bx(6,20,68,32,'Supervised',B)+tm(40,66,'labels ✓')+tm(40,79,'classify')+tm(40,92,'regress')
   +bx(80,20,68,32,'Unsuper.',G)+tm(114,66,'no labels')+tm(114,79,'cluster')+tm(114,92,'reduce dims')
   +bx(154,20,64,32,'Semi-sup.',C)+tm(186,66,'few labels')+tm(186,79,'+ lots of')+tm(186,92,'unlabelled')
   +bx(224,20,70,32,'Reinforce.',Y)+tm(259,66,'rewards')+tm(259,79,'agent acts')+tm(259,92,'learns policy')
   +tm(150,130,'the feedback signal defines the family')},

{n:6,s:'Fundamentals',x:1,q:'What is supervised learning?',
 a:'Learning from data where every input already carries the correct answer, so the model learns the input → output mapping.',
 k:['Classification = discrete output (spam / not spam)','Regression = continuous output (price, temperature)'],
 c:'Labelled points, learned boundary',
 d:ax(24,20,250,104)+dots([[52,44],[70,36],[64,60],[88,50],[46,70],[80,68]],B)
   +dots([[170,96],[196,84],[210,102],[186,110],[228,92],[244,106]],R)
   +pa('M40 118 L262 34',{s:V,sw:2.2,dash:'6 4'})
   +tm(70,26,'class A',{f:B})+tm(238,128,'class B',{f:R})+tm(150,140,'labels known → learn the line')},

{n:7,s:'Fundamentals',x:1,q:'What is unsupervised learning?',
 a:'Learning from data with no labels — the model finds structure by itself.',
 k:['Segmentation, anomaly detection, topic discovery','K-Means, DBSCAN, PCA, autoencoders'],
 c:'No labels — groups discovered, not given',
 d:dots([[54,42],[70,34],[62,56],[84,48],[48,64]],N)+dots([[168,96],[192,86],[206,104],[182,110]],N)
   +dots([[224,44],[244,36],[236,60],[258,50]],N)
   +ci(66,49,30,{s:B,dash:'5 4',sw:1.6})+ci(188,99,28,{s:G,dash:'5 4',sw:1.6})+ci(240,47,26,{s:V,dash:'5 4',sw:1.6})
   +tm(66,10,'cluster 1',{f:B})+tm(188,140,'cluster 2',{f:G})+tm(240,12,'cluster 3',{f:V})},

{n:8,s:'Fundamentals',q:'What is reinforcement learning?',
 a:'An agent takes actions in an environment, lands in new states and receives rewards, learning a policy that maximises long-term reward.',
 k:['No labelled dataset — feedback is delayed and evaluative','Games, robotics, pricing, traffic control'],
 c:'The agent–environment loop',
 d:bx(30,54,80,42,'Agent',B)+bx(190,54,84,42,'Environment',G)
   +pa('M112 66 Q152 40 188 66',{s:B,sw:1.8})+t(150,42,'action',{s:9,f:B,w:600})
   +pa('M188 86 Q150 116 112 86',{s:G,sw:1.8})+t(150,124,'state + reward',{s:9,f:G,w:600})
   +ci(186,66,2.6,{f:B})+ci(114,86,2.6,{f:G})},

{n:9,s:'Fundamentals',x:1,q:'Training vs validation vs test data?',
 a:'Train fits the parameters, validation tunes the hyperparameters and picks the model, test is touched once at the end for an honest estimate.',
 k:['Typical split 70 / 15 / 15','Tuning on the test set makes your number meaningless'],
 c:'Three sets, three distinct jobs',
 d:rc(20,44,182,34,{f:B,o:.18,s:B})+t(111,65,'TRAIN  70%',{s:10,w:700,f:B})
   +rc(206,44,40,34,{f:Y,o:.22,s:Y})+t(226,65,'VAL',{s:9,w:700,f:Y})
   +rc(250,44,32,34,{f:R,o:.2,s:R})+t(266,65,'TEST',{s:8.5,w:700,f:R})
   +tm(111,96,'learn weights')+tm(226,96,'tune')+tm(266,110,'use once')
   +tm(150,132,'never let the test set influence a decision')},

{n:10,s:'Fundamentals',x:1,q:'Parameter vs hyperparameter?',
 a:'Parameters are learned by the model from data. Hyperparameters are set by you before training starts.',
 k:['Parameters: weights, coefficients, split thresholds','Hyperparameters: learning rate, k, max_depth, n_estimators'],
 c:'Who sets it — you, or the data?',
 d:bx(16,34,126,30,'HYPERPARAMETERS',V,{s:9})+tm(79,80,'you set before training')
   +tm(79,96,'learning rate · k · depth')+tm(79,112,'tuned by search + CV')
   +bx(158,34,126,30,'PARAMETERS',G,{s:9})+tm(221,80,'model learns from data')
   +tm(221,96,'weights · coefficients')+tm(221,112,'fitted by gradient descent')
   +ln(150,24,150,128,{s:N,dash:'4 4',o:.5})},

{n:11,s:'Fundamentals',q:'What is inductive bias / No Free Lunch?',
 a:'Inductive bias is the assumptions a model makes to generalise beyond its training data. No Free Lunch says no single algorithm wins on every problem.',
 k:['Linear regression assumes a straight line; KNN assumes neighbours agree','So always baseline several models'],
 c:'Every model assumes something',
 d:pa('M150 26 L150 44',{s:N,sw:2})+pa('M92 44 L208 44',{s:N,sw:2.4})
   +ln(92,44,92,64,{s:N})+ln(208,44,208,64,{s:N})
   +bx(56,64,72,30,'Model A',B)+bx(172,64,72,30,'Model B',V)
   +tm(92,110,'wins here')+tm(208,110,'wins there')
   +tm(150,136,'no universal winner — match bias to problem')},

{n:12,s:'Fundamentals',x:1,q:'What are the steps of an end-to-end ML project?',
 a:'Frame the problem and the metric, get data, EDA, clean, engineer features, split, baseline, model, evaluate, deploy, monitor.',
 k:['70–80% of the effort is data collection and preparation','Split BEFORE preprocessing, or you leak'],
 c:'The pipeline, start to finish',
 d:['Frame','Data','EDA','Clean','Features','Model','Eval','Deploy'].map((s,i)=>{
     const x=6+i*37; const c=[V,B,B,B,B,G,G,Y][i];
     return rc(x,54,32,36,{f:c,o:.16,s:c,r:5})+t(x+16,70,String(i+1),{s:8,f:c,w:700})+t(x+16,82,s,{s:7.3,w:600});
   }).join('')+[0,1,2,3,4,5,6].map(i=>ar(38+i*37,72,44+i*37,72,{s:N,sw:1.2})).join('')
   +pa('M290 96 Q296 120 150 120 Q10 120 22 98',{s:Y,sw:1.4,dash:'4 3'})+tm(150,134,'monitor → retrain')},

/* ---- 2. Statistics ---- */
{n:13,s:'Statistics',q:'Mean, median, mode — when do you use which?',
 a:'Mean is the average, median the middle value, mode the most frequent. Use median when the data is skewed or has outliers.',
 k:['Income and house price → median','Categorical data → mode'],
 c:'On a skewed curve they separate',
 d:pa('M26 118 Q60 34 108 44 Q170 58 274 116',{s:B,sw:2.2})+ln(26,118,278,118,{s:N,o:.6})
   +ln(96,44,96,118,{s:V,sw:1.8})+ln(120,52,120,118,{s:G,sw:1.8})+ln(150,66,150,118,{s:R,sw:1.8})
   +tm(96,36,'mode',{f:V})+tm(126,42,'median',{f:G})+tm(166,58,'mean',{f:R})
   +tm(240,134,'long tail pulls the mean →')},

{n:14,s:'Statistics',q:'What is variance and standard deviation?',
 a:'Variance is the average squared distance from the mean; standard deviation is its square root, back in the original units.',
 k:['High std dev = data spread out','Std dev is what z-score standardisation divides by'],
 c:'Spread around the mean',
 d:pa(bell(150,116,120,74),{s:B,sw:2.2})+ln(30,116,270,116,{s:N,o:.6})+ln(150,42,150,116,{s:R,sw:1.6,dash:'4 3'})
   +ln(104,116,104,86,{s:V,sw:1.4})+ln(196,116,196,86,{s:V,sw:1.4})
   +ar(150,78,196,78,{s:V,sw:1.3})+ar(150,78,104,78,{s:V,sw:1.3})
   +t(150,34,'μ',{s:11,f:R,w:700})+t(174,72,'σ',{s:10,f:V,w:700})
   +tm(150,136,'variance = σ² · std dev = σ')},

{n:15,s:'Statistics',q:'Normal distribution and the empirical rule?',
 a:'A symmetric bell defined by mean and standard deviation, where mean = median = mode.',
 k:['68% within 1σ, 95% within 2σ, 99.7% within 3σ','Which is why "beyond 3σ" is a common outlier rule'],
 c:'68 – 95 – 99.7',
 d:pa(bell(150,116,128,76),{s:B,sw:2.2,f:B})+`<path d="${bell(150,116,128,76)}" fill="${B}" opacity=".1"/>`
   +ln(22,116,278,116,{s:N,o:.6})
   +[[-3,'3σ'],[-2,'2σ'],[-1,'1σ'],[0,'μ'],[1,'1σ'],[2,'2σ'],[3,'3σ']].map(([i,l])=>
     ln(150+i*42,116,150+i*42,121,{s:N})+tm(150+i*42,132,l)).join('')

{n:16,s:'Statistics',x:1,q:'What is the Central Limit Theorem?',

{n:17,s:'Statistics',x:1,q:'What is a p-value?',
 a:'The probability of seeing a result at least as extreme as yours, assuming the null hypothesis is true. Small p means the data is unlikely under the null.',
 k:['p < 0.05 → reject the null','It is NOT the probability the hypothesis is true'],

   +ln(20,112,280,112,{s:N,o:.6})+ln(228,112,228,64,{s:R,sw:1.6,dash:'4 3'})

   +ar(252,62,236,92,{s:R,sw:1.3})+tm(150,134,'that shaded tail area IS the p-value')},

{n:18,s:'Statistics',q:'Type I vs Type II error?',
 a:'Type I (α) is a false positive — rejecting a true null. Type II (β) is a false negative — missing a real effect.',
 k:['Type I: telling a healthy patient they are sick','Type II: missing a real disease','Lower one, the other usually rises'],

   +t(127,104,'✓ correct',{s:9.5,w:600,f:G})
   +rc(179,82,87,38,{f:Y,o:.24,r:4})+t(222,98,'Type II',{s:10,w:700,f:Y})+tm(222,112,'false negative')},

{n:19,s:'Statistics',x:1,q:'Correlation vs causation? Covariance vs correlation?',
 a:'Correlation means two things move together; causation means one makes the other change. Correlation is covariance normalised to −1…1.',

   +bx(112,20,76,30,'Hot weather',Y)
   +ar(136,52,60,80,{s:Y,sw:1.5})+ar(166,52,236,80,{s:Y,sw:1.5})
   +tm(150,140,'the confounder causes both')},

{n:20,s:'Statistics',x:1,q:"What is Bayes' theorem?",
 a:'It updates a prior belief using new evidence to produce a posterior: P(A|B) = P(B|A)·P(A) / P(B).',
 k:['Basis of Naive Bayes classifiers','A rare disease + a 99% accurate test still gives a low posterior'],

   +t(150,32,'P(A|B) = P(B|A)·P(A) / P(B)',{s:10.5,w:600,f:V})},

/* ---- 3. Data prep ---- */
{n:21,s:'Data prep',x:1,q:'How do you handle missing values?',
 a:'Ask why it is missing first, then drop, impute (median / mode / KNN), or flag it — always fitting the imputer on train only.',
 k:['Median for skewed numeric, mode for categorical','Add a was_missing flag — missingness can be predictive','Fit on train, transform test → no leakage'],

 a:'Detect with a box plot / IQR rule, z-scores, or Isolation Forest. Then remove, cap, transform, or use a robust model.',
 k:['IQR rule: below Q1−1.5·IQR or above Q3+1.5·IQR','Trees tolerate outliers; linear regression and K-Means do not'],

{n:23,s:'Data prep',x:1,q:'What is feature scaling? Normalisation vs standardisation?',
 a:'Bringing features onto a comparable range so no feature dominates just because of its units.',
 k:['Min-Max → 0…1  ·  Z-score → mean 0, std 1','Needed: KNN, K-Means, SVM, PCA, neural nets','Not needed: trees, Random Forest, XGBoost'],
 c:'Before and after scaling',
 d:ax(18,24,116,92)+dots([[36,110],[44,104],[52,112],[40,116],[60,106]],R)

   +ax(174,24,110,92)+dots([[204,72],[220,60],[236,84],[212,90],[248,68]],G)
   +tm(238,132,'comparable ranges',{s:8})+tm(238,16,'scaled',{f:G})},

{n:24,s:'Data prep',x:1,q:'How do you encode categorical variables?',
 a:'Label encoding for ordinal or tree models, one-hot for nominal, target encoding for high cardinality (computed inside CV folds).',
 k:['Label encoding invents a fake order — risky for linear models','One-hot explodes with high cardinality'],
 c:'One column becomes many',
 d:rc(16,44,58,64,{s:N,o:.6,r:4})+tm(45,34,'city')

   +ar(80,76,104,76,{s:N})
   +[0,1,2].map(r=>[0,1,2].map(c2=>rc(112+c2*36,46+r*20,32,16,{f:r===c2?G:N,o:r===c2?.35:.12,s:r===c2?G:N,r:3})

   +tm(150,136,'one-hot: one binary column per category')},

{n:25,s:'Data prep',q:'What is the dummy variable trap?',
 a:'One-hot encoding k categories into k columns while keeping an intercept makes the columns perfectly collinear — they always sum to 1.',
 k:['Fix by dropping one column (drop_first=True)','Matters for linear/logistic regression, not for trees'],
 c:'k columns + intercept = redundant',
 d:[0,1,2].map(r=>[0,1,2].map(c2=>rc(70+c2*44,40+r*22,40,18,{f:r===c2?B:N,o:r===c2?.3:.1,s:r===c2?B:N,r:3})

   +rc(202,40,52,62,{s:R,sw:2,dash:'4 3',r:5})+tm(228,116,'drop this one',{f:R})
   +t(150,24,'col1 + col2 + col3 = 1  always',{s:10,w:600,f:R})
   +tm(150,140,'perfect collinearity breaks the coefficients')},

{n:26,s:'Data prep',x:1,q:'What is feature engineering?',
 a:'Creating new input variables from raw data so the model can learn more easily — often the single biggest lever on accuracy.',

{n:27,s:'Data prep',q:'What is feature selection?',
 a:'Keeping only the useful features — improves accuracy, speed and interpretability while reducing overfitting.',
 k:['Filter: correlation, chi-square, mutual information','Wrapper: RFE, forward/backward selection','Embedded: Lasso, tree importance'],

{n:28,s:'Data prep',x:1,q:'What is the curse of dimensionality?',
 a:'As features grow, the space grows exponentially, data becomes sparse, distances stop meaning anything and models overfit.',
 k:['Nearest and farthest points become almost equidistant','Hurts KNN, K-Means, SVM most','Fix: selection, PCA, regularisation'],

   +dots([[212,84],[262,44],[236,66]],B)+tm(239,120,'3-D: sparse',{f:R})
   +tm(150,140,'data needed grows exponentially')},

{n:29,s:'Data prep',q:'What is multicollinearity?',
 a:'Two or more predictors are highly correlated with each other, so coefficients become unstable and uninterpretable even though predictions stay fine.',
 k:['Detect with a correlation matrix or VIF (>5 suspicious, >10 serious)','Fix: drop one, combine, PCA, or Ridge'],

   +tm(150,140,'model cannot tell which one deserves credit')},

{n:30,s:'Data prep',x:1,q:'What is data leakage?',
 a:'Information not available at prediction time sneaks into training, giving a great validation score that collapses in production.',
 k:['Scaling or imputing BEFORE the split','Target-derived features; future data in time series','Fix: split first, then use a Pipeline'],

   +t(150,124,'…and catches zero of what matters',{s:9.5,f:N})
   +tm(150,142,'weights · threshold · SMOTE · stratify')},

/* ---- 4. Supervised algorithms ---- */
{n:32,s:'Algorithms',x:1,q:'Explain linear regression and its assumptions.',

{n:33,s:'Algorithms',q:'Cost function of linear regression and how is it minimised?',
 a:'Mean Squared Error, which is convex so it has a single global minimum. Solved by the normal equation or gradient descent.',

   +tm(46,40,'MSE')+tm(258,140,'weights →')},

 a:'Yes — the decision boundary is linear in the features. Only the output is transformed non-linearly by the sigmoid.',

   +rc(186,74,80,28,{f:R,o:.15,s:R,r:5})+[0,1,2].map(i=>ci(208+i*14,88,4.2,{f:R})).join('')+tm(226,114,'entropy = 0',{f:R})

   +tm(74,118,'reduces variance',{f:B})
   +ln(150,14,150,132,{s:N,dash:'4 4',o:.4})

/* ============================ app ============================ */
const $=id=>document.getElementById(id);
let order=[], idx=0, flipped=false, sec='All', hideKnown=false;
let known=new Set(JSON.parse(localStorage.getItem('mlcards_known')||'[]'));
const save=()=>localStorage.setItem('mlcards_known',JSON.stringify([...known]));

const sections=['All',...new Set(CARDS.map(c=>c.s))];
$('sec').innerHTML=sections.map(s=>`<option value="${s}">${s==='All'?'All sections':s}</option>`).join('');

function build(shuffle){
  order=CARDS.filter(c=>(sec==='All'||c.s===sec)&&(!hideKnown||!known.has(c.n))).map(c=>c.n);
  if(!order.length){order=CARDS.filter(c=>sec==='All'||c.s===sec).map(c=>c.n); hideKnown=false; $('hide').classList.remove('on');}
  if(shuffle) for(let i=order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[order[i],order[j]]=[order[j],order[i]];}
  idx=0; render();
}
function card(){ return CARDS.find(c=>c.n===order[idx]); }

function render(){
  const c=card(); if(!c) return;
  flipped=false; $('card').classList.remove('flip');
  $('fsec').textContent=c.s;
  $('fnum').textContent=`Q${c.n} of 100`;
  $('fstar').textContent=c.x?'★'.repeat(c.x):'';
  $('fq').textContent=c.q;
  $('bq').textContent=`Q${c.n} · ${c.q}`;
  $('ba').textContent=c.a;
  $('bk').innerHTML=c.k.map(k=>`<li>${k}</li>`).join('');
  $('bd').innerHTML=S(c.d);
  $('bc').textContent=c.c||'';
  $('mark').classList.toggle('on',known.has(c.n));
  $('count').textContent=`${idx+1} / ${order.length}  ·  ${known.size} known`;
  $('fill').style.width=((idx+1)/order.length*100)+'%';
  drawGrid();
}
function drawGrid(){
  $('gridbox').innerHTML=order.map((n,i)=>
    `<b class="${i===idx?'cur':''} ${known.has(n)?'kn':''}" data-i="${i}">${n}</b>`).join('');
}
const go=d=>{ idx=(idx+d+order.length)%order.length; render(); };
const flip=()=>{ flipped=!flipped; $('card').classList.toggle('flip',flipped); };

$('flip').onclick=flip;
$('card').onclick=flip;
$('prev').onclick=e=>{e.stopPropagation();go(-1);};
$('next').onclick=e=>{e.stopPropagation();go(1);};
$('mark').onclick=e=>{e.stopPropagation();const n=card().n;
  known.has(n)?known.delete(n):known.add(n); save();
  $('mark').classList.toggle('on',known.has(n));
  $('count').textContent=`${idx+1} / ${order.length}  ·  ${known.size} known`; drawGrid();};
$('sec').onchange=e=>{sec=e.target.value;build(false);};
$('shuffle').onclick=()=>build(true);
$('hide').onclick=e=>{hideKnown=!hideKnown;e.target.classList.toggle('on',hideKnown);build(false);};
$('grid').onclick=e=>{$('gridbox').classList.toggle('show');e.target.classList.toggle('on');};
$('gridbox').onclick=e=>{const b=e.target.closest('b'); if(b){idx=+b.dataset.i;render();}};
$('theme').onclick=()=>{const d=document.documentElement;
  const nx=d.getAttribute('data-theme')==='dark'?'light':'dark';
  d.setAttribute('data-theme',nx); localStorage.setItem('mlcards_theme',nx);};
if(localStorage.getItem('mlcards_theme')==='dark') document.documentElement.setAttribute('data-theme','dark');

document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();flip();}
  else if(e.key==='ArrowRight')go(1);
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key.toLowerCase()==='k')$('mark').click();
  else if(e.key.toLowerCase()==='s')build(true);
});

build(false);
</script>
